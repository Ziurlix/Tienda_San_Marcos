<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veterinaria San Marcos</title>
    <link rel ="stylesheet" href ="style.css">
</head>
<body>

    <header> 
        <div> 
            <img> 
            <span> Veterinaria San Marcos </span>
        </div>
        <nav>  
            <ul>
                <li><a href="#"> Home </a></li>
                <li><a href="#"> Servicios </a></li>
                <li><a href="#"> Nuestro equipo </a></li>
                <li><a href="#"> Portal mascotas </a></li>
                <li><a href="#"> Contacto </a></li>
            </ul>
        </nav>
        
        <div>
            <button> Iniciar Sesion </button>
            <button> Registrarse </button>
        </div>
    </header>

    
                    <!-- === Formulario de registro ===-->
    <main> 
        <section>
            <div class ="Login-container"> 
                <h1> Crea tu Cuenta</h1>
                <form id ="loginForm">
                    
                     <!-- == Sec 1. Nombre == -->
                    <div>
                     <label for ="user"> Nombre completo</label>
                     <input type ="text" id ="user" placeholder ="Nombre completo">
                    </div>

                    
                    <!-- == Sec 2. Correo electronico == -->
                    <div>
                     <label for ="email"> Direccion de correo</label>
                     <input type ="email" id ="email" placeholder ="Direccion de correo">
                    </div>
                    
                    <!-- == Sec 3. Numero de telefono== -->
                    <div>
                     <label for ="phone"> Numero de telefono</label>
                     <input type ="tel" id ="phone" placeholder ="Numero de telefono" maxlength="10" inputmode="numeric" required>
                    </div>

                    <!-- == Sec 4. Contraseña== -->
                    <div> 
                     <label for ="password"> Crea una contraseña</label>
                     <input type ="password" id ="password" placeholder ="crea una contraseña">
                    </div>

                    <!-- == Sec 5. Confirmacion contraseña == -->
                    <div>
                     <label for ="confirm-psw"> Confirma tu contraseña</label>
                     <input type ="password" id ="confirm-psw" placeholder ="confirma tu contraseña">
                    </div>

                    <!-- == Sec 6. Terminos y Condiciones== -->
                    <div class ="checkbox-container">
                     <input type ="checkbox" id ="terms" name ="terminos" required>
                     <label for ="terms"> Acepto los <a href="/terminos" target="_blank"> terminos de uso y privacidad
                     </a> </label>  
                    </div>

                    <!-- == Sec 7. Boton de envio == -->
                    <button type ="submit"> Crear Cuenta </button>

                    <!-- == Sec 8. Enlace de inicio de sesion== -->
                    <div>
                     <label for ="Login"> Ya tienes una cuenta? <a href="/Login" target ="_blank"> Inicia sesion    
                     </a> </label>
                    </div>
                </form>
            </div>
        </section>
                    <!-- === Fin de Formulario de registro ===-->

        <!-- Agregar imagen y video -->

        <article class ="multimedia-container"> 
            <h2 style ="text-align: center; margin-bottom: 15px;"> Conoce nuestra clinica </h2>
            
            <img src ="https://static.wixstatic.com/media/ad9b66_9ef04cc1ba7c450685b013d5edfa4732~mv2.png/v1/fill/w_280,h_204,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/perros%20y%20gatos.png">
           
            <video controls>
                <source src="videoMascotas.mp4" type="video/mp4">     
            </video>
        </article>

    </main>

    <footer>
        <div class ="footer-info">
            <p> Direccion: Rancagua, Region de O'Higgins</p>
            <p> Contacto: +56 9 1234 5678</p>
        </div>

        <div class ="footer-copy">
            <p> &copy; 2024 Veterinaria San Marcos. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="script.js"></script>
    
</body>
</html>
